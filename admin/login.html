<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c241c" />
  <link rel="icon" type="image/jpeg" href="../img/umat.jpg" />
  <link rel="apple-touch-icon" href="../img/umat.jpg" />
  <title>Admin login — UniAssist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css?v=5" />
</head>
<body class="auth-page">
  <div class="auth-box">
    <a class="logo" href="../index.html">
      <img class="logo-img" src="../img/umat.jpg" alt="UMAT logo" />
      UniAssist
    </a>
    <h1>Admin desk</h1>
    <p class="sub">Manage requests, assign work, and communicate with students.</p>

    <div id="form-error" class="form-error" hidden></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;margin-top:0.5rem">Sign in</button>
    </form>

    <p class="form-footer" style="margin-top:1rem"><a href="../index.html">← Back to site</a></p>
    <p class="form-footer"><a href="../auth/forgot-password.html">Forgot your password?</a></p>
  </div>

  <script type="module">
    import { supabase, getProfile } from '../js/lib/supabase.js';

    const form      = document.getElementById('login-form');
    const errEl     = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    // Don't auto-redirect on page load — always require manual sign in

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.hidden = true;

      const email    = form.email.value.trim();
      const password = form.password.value;
      if (!email || !password) { errEl.textContent = 'Please fill both fields.'; errEl.hidden = false; return; }

      submitBtn.textContent = 'Signing in…';
      submitBtn.disabled    = true;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      submitBtn.textContent = 'Sign in';
      submitBtn.disabled    = false;

      if (error) { errEl.textContent = error.message; errEl.hidden = false; return; }

      const profile = await getProfile(data.user.id).catch(() => null);
      if (!['admin','super_admin'].includes(profile?.role)) {
        await supabase.auth.signOut();
        errEl.textContent = 'Access denied. This login is for admins only.';
        errEl.hidden = false;
        return;
      }

      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
