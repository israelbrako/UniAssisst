<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c241c" />
  <link rel="icon" type="image/jpeg" href="../img/umat.jpg" />
  <link rel="apple-touch-icon" href="../img/umat.jpg" />
  <title>My Work — UniAssist Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css?v=5" />
  <link rel="stylesheet" href="../css/app.css?v=1" />
  <style>
    .app-content { opacity: 0; transition: opacity .2s; }
    .app-content.ready { opacity: 1; }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-content" id="app-content">
      <div class="app-topbar">
        <button class="sidebar-toggle" id="sidebar-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <a class="logo" href="../index.html"><img class="logo-img" src="../img/umat.jpg" alt="UMAT" /> UniAssist</a>
      </div>

      <div class="app-content-inner">
        <div class="app-page-hd">
          <h1 id="page-title">My Work</h1>
          <p>Requests currently assigned to you.</p>
        </div>

        <div class="stat-grid">
          <div class="stat-card-dark"><div class="sc-label">Accepted</div><span class="sc-value" id="s-accepted">0</span><span class="sc-sub">Awaiting start</span></div>
          <div class="stat-card-dark"><div class="sc-label">In Progress</div><span class="sc-value" id="s-inprog">0</span><span class="sc-sub">Being handled</span></div>
          <div class="stat-card-dark"><div class="sc-label">Review</div><span class="sc-value" id="s-review">0</span><span class="sc-sub">Student checking</span></div>
          <div class="stat-card-dark"><div class="sc-label">Completed</div><span class="sc-value" id="s-done">0</span><span class="sc-sub">All time</span></div>
        </div>

        <div class="content-panel">
          <div class="content-panel-hd"><h2>Active Work</h2></div>
          <div class="content-panel-body">
            <div id="work-list" class="req-list"></div>
          </div>
        </div>
      </div>

      <footer class="site-footer">
        <div class="container footer-inner"><p>© <span id="year"></span> UniAssist · ASCES Department</p></div>
        <div class="container footer-credit-row"><div class="webverse-credit"><span>Developed by</span><div class="webverse-credit-img-wrap"><img src="../img/webverse-logo-color.png" alt="WebVerse" /></div></div></div>
      </footer>
    </div>
  </div>

  <script src="../js/main.js?v=5"></script>
  <script type="module">
    import { supabase, requireAdmin } from '../js/lib/supabase.js';
    import { badge, timeAgo, fmtDate, escHtml, buildSidebar } from '../js/lib/ui.js';
    import { startSessionTimer } from '../js/lib/session.js';

    async function init() {
      const auth = await requireAdmin('login.html');
      if (!auth) return;
      const { user, profile } = auth;

      const firstName = profile.full_name?.split(' ')[0] ?? '';
      document.getElementById('page-title').textContent = `My Work — ${firstName}`;
      document.getElementById('year').textContent = new Date().getFullYear();

      buildSidebar({ role: profile.role, profile, active: 'my-work', basePath: '../',
        onSignout: async () => { await supabase.auth.signOut(); window.location.href = 'login.html'; } });

      startSessionTimer('login.html');
      document.getElementById('app-content').classList.add('ready');

      await loadWork(user.id);
      supabase.channel('my-work-' + user.id)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'requests', filter: `assigned_to=eq.${user.id}` }, () => loadWork(user.id))
        .subscribe();
    }

    async function loadWork(userId) {
      const { data, error } = await supabase
        .from('requests')
        .select(`id, service, title, status, created_at, deadline, student:student_id ( full_name, email )`)
        .eq('assigned_to', userId)
        .not('status', 'in', '("declined","pending")')
        .order('created_at', { ascending: false });

      if (error) { console.error(error); return; }
      const all = data ?? [];

      document.getElementById('s-accepted').textContent = all.filter(r => r.status === 'accepted').length;
      document.getElementById('s-inprog').textContent   = all.filter(r => r.status === 'in_progress').length;
      document.getElementById('s-review').textContent   = all.filter(r => r.status === 'review').length;
      document.getElementById('s-done').textContent     = all.filter(r => r.status === 'completed').length;

      const active = all.filter(r => !['completed','declined'].includes(r.status));
      const list   = document.getElementById('work-list');

      if (active.length === 0) {
        list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><p>No active work right now. Nice.</p></div>`;
        return;
      }

      list.innerHTML = active.map(r => `
        <a class="req-card" href="request.html?id=${r.id}">
          <div class="req-card-top"><h3>${escHtml(r.title)}</h3>${badge(r.status)}</div>
          <div class="req-card-meta">
            <span>${escHtml(r.service)}</span>
            <span>${escHtml(r.student?.full_name ?? '')}</span>
            ${r.deadline ? `<span>Due ${escHtml(r.deadline)}</span>` : ''}
            <span>${timeAgo(r.created_at)}</span>
          </div>
        </a>`).join('');
    }

    init();
  </script>
</body>
</html>
