<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c241c" />
  <link rel="icon" type="image/jpeg" href="../img/umat.jpg" />
  <link rel="apple-touch-icon" href="../img/umat.jpg" />
  <title>Request — UniAssist Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css?v=5" />
  <link rel="stylesheet" href="../css/app.css?v=1" />
  <style>
    .app-content { opacity: 0; transition: opacity .2s; }
    .app-content.ready { opacity: 1; }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-content" id="app-content">
      <div class="app-topbar">
        <button class="sidebar-toggle" id="sidebar-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <a class="logo" href="../index.html"><img class="logo-img" src="../img/umat.jpg" alt="UMAT" /> UniAssist</a>
      </div>

      <div class="app-content-inner" style="max-width:960px">
        <a href="index.html" style="display:inline-flex;align-items:center;gap:0.3rem;color:var(--muted);text-decoration:none;font-size:0.88rem;margin-bottom:1rem">← Queue</a>

        <div class="app-page-hd">
          <div><h1 id="req-title">Loading…</h1><p id="req-meta"></p></div>
          <div id="req-badge"></div>
        </div>

        <div id="action-buttons" style="display:flex;gap:0.65rem;flex-wrap:wrap;margin-bottom:1.5rem"></div>

        <!-- Decline modal -->
        <div id="decline-modal" class="modal" aria-hidden="true">
          <div class="modal-backdrop" data-modal-close></div>
          <div class="modal-panel" role="dialog" aria-modal="true" style="max-width:460px">
            <button class="modal-close" data-modal-close aria-label="Close">×</button>
            <h3>Decline request</h3>
            <p style="color:var(--muted);margin:0 0 1rem">Give the student a brief reason so they know what to do next.</p>
            <div class="field">
              <label for="decline-reason">Reason (optional)</label>
              <textarea id="decline-reason" rows="3" placeholder="e.g. Not enough detail provided."></textarea>
            </div>
            <div style="display:flex;gap:0.5rem;justify-content:flex-end;margin-top:0.5rem">
              <button class="btn btn-ghost dark" data-modal-close style="width:auto">Cancel</button>
              <button class="btn btn-primary" id="confirm-decline-btn" style="width:auto;background:#c0392b;color:#fff;border-color:#c0392b">Decline request</button>
            </div>
          </div>
        </div>

        <!-- Status update modal -->
        <div id="update-modal" class="modal" aria-hidden="true">
          <div class="modal-backdrop" data-modal-close></div>
          <div class="modal-panel" role="dialog" aria-modal="true" style="max-width:460px">
            <button class="modal-close" data-modal-close aria-label="Close">×</button>
            <h3>Post a status update</h3>
            <div class="field">
              <label for="update-status">New status</label>
              <select id="update-status">
                <option value="in_progress">In Progress</option>
                <option value="review">Review — student to check work</option>
                <option value="completed">Completed</option>
              </select>
            </div>
            <div class="field">
              <label for="update-note">Note to student</label>
              <textarea id="update-note" rows="3" placeholder="e.g. We've started on your assignment. First draft ready by Friday."></textarea>
            </div>
            <div style="display:flex;gap:0.5rem;justify-content:flex-end;margin-top:0.5rem">
              <button class="btn btn-ghost dark" data-modal-close style="width:auto">Cancel</button>
              <button class="btn btn-primary" id="confirm-update-btn" style="width:auto">Post update</button>
            </div>
          </div>
        </div>

        <div style="display:grid;gap:1rem" id="body-grid">
          <!-- Left col -->
          <div>
            <div class="content-panel">
              <div class="content-panel-hd"><h2>Student</h2></div>
              <div class="content-panel-body"><dl id="student-details"></dl></div>
            </div>
            <div class="content-panel">
              <div class="content-panel-hd"><h2>Request Details</h2></div>
              <div class="content-panel-body"><dl id="req-details"></dl></div>
            </div>
            <div class="content-panel">
              <div class="content-panel-hd"><h2>Timeline</h2></div>
              <div class="content-panel-body"><ul class="timeline" id="timeline"></ul></div>
            </div>
          </div>
          <!-- Right col: chat -->
          <div id="chat-section">
            <div class="content-panel" style="padding:0">
              <div class="content-panel-hd" style="padding:0.85rem 1.25rem 0.75rem">
                <h2>Chat with student</h2>
              </div>
              <div class="chat-wrap" style="border:none;border-radius:0">
                <div class="chat-messages" id="chat-messages">
                  <p style="color:var(--muted);font-size:0.88rem;text-align:center;margin:auto">Chat available after accepting the request.</p>
                </div>
                <div class="chat-input-row" id="chat-input-row" style="display:none">
                  <textarea id="msg-input" placeholder="Type a message…" rows="1"></textarea>
                  <button class="btn btn-primary" id="send-btn" style="width:auto;min-height:42px;padding:0 1rem">Send</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="site-footer">
        <div class="container footer-inner"><p>© <span id="year"></span> UniAssist · ASCES Department</p></div>
        <div class="container footer-credit-row"><div class="webverse-credit"><span>Developed by</span><div class="webverse-credit-img-wrap"><img src="../img/webverse-logo-color.png" alt="WebVerse" /></div></div></div>
      </footer>
    </div>
  </div>

  <script src="../js/main.js?v=5"></script>
  <script type="module">
    import { supabase, requireAdmin } from '../js/lib/supabase.js';
    import { badge, timeAgo, fmtDate, escHtml, buildSidebar } from '../js/lib/ui.js';
    import { startSessionTimer } from '../js/lib/session.js';

    const reqId = new URLSearchParams(location.search).get('id');
    let currentAdmin = null;
    let currentReq   = null;

    async function init() {
      const auth = await requireAdmin('login.html');
      if (!auth) return;
      currentAdmin = auth;

      document.getElementById('year').textContent = new Date().getFullYear();
      buildSidebar({ role: auth.profile.role, profile: auth.profile, active: 'queue', basePath: '../',
        onSignout: async () => { await supabase.auth.signOut(); window.location.href = 'login.html'; } });

      startSessionTimer('login.html');
      document.getElementById('app-content').classList.add('ready');

      if (!reqId) { window.location.href = 'index.html'; return; }
      await loadRequest();
      subscribeRealtime();
      setupModals();
    }

    async function loadRequest() {
      const { data: req, error } = await supabase
        .from('requests')
        .select(`*, student:student_id ( id, full_name, email ), assigned_to ( id, full_name )`)
        .eq('id', reqId).single();

      if (error || !req) { window.location.href = 'index.html'; return; }
      currentReq = req;

      document.getElementById('req-title').textContent = req.title;
      document.getElementById('req-meta').textContent  = `${req.service} · ${timeAgo(req.created_at)}`;
      document.getElementById('req-badge').innerHTML   = badge(req.status);
      renderActionButtons(req);

      document.getElementById('student-details').innerHTML = `
        <div class="kv"><dt>Name</dt><dd>${escHtml(req.student?.full_name ?? '—')}</dd></div>
        <div class="kv"><dt>Email</dt><dd><a href="mailto:${escHtml(req.student?.email ?? '')}">${escHtml(req.student?.email ?? '')}</a></dd></div>`;

      document.getElementById('req-details').innerHTML = `
        <div class="kv"><dt>Service</dt><dd>${escHtml(req.service)}</dd></div>
        <div class="kv"><dt>Class / Year</dt><dd>${escHtml(req.class_year ?? '—')}</dd></div>
        <div class="kv"><dt>Deadline</dt><dd>${fmtDate(req.deadline)}</dd></div>
        <div class="kv"><dt>Description</dt><dd class="note-box">${escHtml(req.description)}</dd></div>
        ${req.file_url ? `<div class="kv"><dt>Attachment</dt><dd><a href="${escHtml(req.file_url)}" target="_blank">Download</a></dd></div>` : ''}
        <div class="kv"><dt>Assigned to</dt><dd>${req.assigned_to ? escHtml(req.assigned_to.full_name) : '<span style="color:var(--muted)">Unassigned</span>'}</dd></div>`;

      await loadTimeline();

      const chatStatuses = ['accepted','in_progress','review','completed'];
      const isAssigned   = req.assigned_to?.id === currentAdmin.user.id;

      if (chatStatuses.includes(req.status) && isAssigned) {
        document.getElementById('chat-input-row').style.display = 'flex';
        await loadMessages();
        setupChat();
      } else if (chatStatuses.includes(req.status) && !isAssigned) {
        document.getElementById('chat-section').style.display = 'none';
      }

      if (window.innerWidth >= 800) {
        document.getElementById('body-grid').style.gridTemplateColumns = '1fr 1fr';
      }
    }

    function renderActionButtons(req) {
      const container = document.getElementById('action-buttons');
      const btns = [];
      if (req.status === 'assigned') {
        btns.push(`<button class="btn btn-primary" id="btn-accept" style="width:auto">✓ Accept</button>`);
        btns.push(`<button class="btn btn-ghost dark" id="btn-decline" style="width:auto">✗ Decline</button>`);
      }
      if (['accepted','in_progress','review'].includes(req.status))
        btns.push(`<button class="btn btn-primary" id="btn-update" style="width:auto">Post update</button>`);
      if (['completed','declined'].includes(req.status))
        btns.push(`<span style="color:var(--muted);font-size:0.9rem">This request is ${req.status}.</span>`);
      container.innerHTML = btns.join('');
      document.getElementById('btn-accept')?.addEventListener('click', acceptRequest);
      document.getElementById('btn-decline')?.addEventListener('click', () => openModal('decline-modal'));
      document.getElementById('btn-update')?.addEventListener('click', () => openModal('update-modal'));
    }

    async function acceptRequest() {
      const { error } = await supabase.from('requests').update({ status: 'accepted' }).eq('id', reqId);
      if (error) return alert(error.message);
      await postStatusUpdate('accepted', 'Your request has been accepted. We will be in touch shortly.');
      await supabase.from('notifications').insert({
        user_id: currentReq.student_id, request_id: reqId, type: 'accepted',
        body: `Your request "${currentReq.title}" has been accepted by ${currentAdmin.profile.full_name}.`,
      });
      await loadRequest();
    }

    async function declineRequest() {
      const reason = document.getElementById('decline-reason').value.trim();
      const { error } = await supabase.from('requests').update({ status: 'declined', decline_reason: reason || null }).eq('id', reqId);
      if (error) return alert(error.message);
      await postStatusUpdate('declined', reason || 'Request was declined.');
      await supabase.from('notifications').insert({
        user_id: currentReq.student_id, request_id: reqId, type: 'declined',
        body: `Your request "${currentReq.title}" was declined.${reason ? ' Reason: ' + reason : ''}`,
      });
      closeModal('decline-modal');
      await supabase.rpc('decrement_active_requests', { admin_id: currentReq.assigned_to?.id });
      await loadRequest();
    }

    async function postStatusUpdate(status, note) {
      await supabase.from('status_updates').insert({ request_id: reqId, admin_id: currentAdmin.user.id, status, note });
    }

    async function postUpdate() {
      const status = document.getElementById('update-status').value;
      const note   = document.getElementById('update-note').value.trim();
      if (!note) { alert('Please add a note for the student.'); return; }
      await supabase.from('requests').update({ status }).eq('id', reqId);
      await postStatusUpdate(status, note);
      await supabase.from('notifications').insert({
        user_id: currentReq.student_id, request_id: reqId, type: 'status_update',
        body: `Update on "${currentReq.title}": ${note}`,
      });
      if (status === 'completed') await supabase.rpc('decrement_active_requests', { admin_id: currentAdmin.user.id });
      closeModal('update-modal');
      await loadRequest();
    }

    async function loadTimeline() {
      const { data } = await supabase.from('status_updates').select(`*, admin:admin_id ( full_name )`).eq('request_id', reqId).order('created_at', { ascending: true });
      const tl = document.getElementById('timeline');
      if (!data || data.length === 0) { tl.innerHTML = '<li style="color:var(--muted);font-size:0.88rem">No updates yet.</li>'; return; }
      tl.innerHTML = data.map(u => `
        <li class="tl-item">
          <div class="tl-dot"></div>
          <div class="tl-body">
            <p class="tl-status">${escHtml(u.status)}</p>
            ${u.note ? `<p class="tl-note">${escHtml(u.note)}</p>` : ''}
            <p class="tl-time">${u.admin?.full_name ? escHtml(u.admin.full_name) + ' · ' : ''}${timeAgo(u.created_at)}</p>
          </div>
        </li>`).join('');
    }

    async function loadMessages() {
      const { data } = await supabase.from('messages').select(`*, sender:sender_id ( full_name )`).eq('request_id', reqId).order('created_at', { ascending: true });
      const container = document.getElementById('chat-messages');
      if (!data || data.length === 0) { container.innerHTML = '<p style="color:var(--muted);font-size:0.88rem;text-align:center;margin:auto">No messages yet.</p>'; return; }
      container.innerHTML = data.map(m => {
        const mine = m.sender_id === currentAdmin.user.id;
        return `<div class="msg ${mine ? 'msg-mine' : 'msg-theirs'}">
          <div class="msg-bubble">${escHtml(m.content)}</div>
          <span class="msg-meta">${mine ? 'You' : escHtml(m.sender?.full_name ?? 'Student')} · ${timeAgo(m.created_at)}</span>
        </div>`;
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    function setupChat() {
      const input = document.getElementById('msg-input');
      const sendBtn = document.getElementById('send-btn');
      async function send() {
        const content = input.value.trim();
        if (!content) return;
        input.value = ''; sendBtn.disabled = true;
        const { error } = await supabase.from('messages').insert({ request_id: reqId, sender_id: currentAdmin.user.id, content });
        if (error) { alert('Could not send: ' + error.message); input.value = content; sendBtn.disabled = false; return; }
        await supabase.from('notifications').insert({
          user_id: currentReq.student_id, request_id: reqId, type: 'new_message',
          body: `${currentAdmin.profile.full_name} sent you a message on "${currentReq.title}".`,
        });
        await loadMessages(); sendBtn.disabled = false; input.focus();
      }
      sendBtn.addEventListener('click', send);
      input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    }

    function setupModals() {
      document.getElementById('confirm-decline-btn').addEventListener('click', declineRequest);
      document.getElementById('confirm-update-btn').addEventListener('click', postUpdate);
      document.querySelectorAll('[data-modal-close]').forEach(el => {
        el.addEventListener('click', e => { e.preventDefault(); e.target.closest('.modal')?.setAttribute('aria-hidden', 'true'); });
      });
    }

    function openModal(id)  { document.getElementById(id).setAttribute('aria-hidden', 'false'); }
    function closeModal(id) { document.getElementById(id).setAttribute('aria-hidden', 'true'); }

    function subscribeRealtime() {
      supabase.channel('admin-req-' + reqId)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `request_id=eq.${reqId}` }, () => loadMessages())
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'status_updates', filter: `request_id=eq.${reqId}` }, () => loadTimeline())
        .subscribe();
      setInterval(() => loadMessages(), 3000);
    }

    init();
  </script>
</body>
</html>
