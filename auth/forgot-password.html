<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c241c" />
  <link rel="icon" type="image/jpeg" href="../img/umat.jpg" />
  <link rel="apple-touch-icon" href="../img/umat.jpg" />
  <title>Reset password — UniAssist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css?v=5" />
</head>
<body class="auth-page">
  <div class="auth-box">
    <a class="logo" href="../index.html">
      <img class="logo-img" src="../img/umat.jpg" alt="UMAT logo" />
      UniAssist
    </a>
    <h1>Reset password</h1>
    <p class="sub">Enter your email and we'll send you a reset link.</p>

    <div id="form-error" class="form-error" hidden></div>
    <div id="form-success" class="form-success" hidden></div>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" />
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;margin-top:0.5rem">
        Send reset link
      </button>
    </form>

    <p class="form-footer"><a href="login.html">← Back to sign in</a></p>
  </div>

  <script type="module">
    import { supabase } from '../js/lib/supabase.js';

    const form      = document.getElementById('reset-form');
    const errEl     = document.getElementById('form-error');
    const succEl    = document.getElementById('form-success');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.hidden  = true;
      succEl.hidden = true;

      const email = form.email.value.trim();
      if (!email) {
        errEl.textContent = 'Please enter your email address.';
        errEl.hidden = false;
        return;
      }

      submitBtn.textContent = 'Sending…';
      submitBtn.disabled    = true;

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: `https://uniassisst-seven.vercel.app/auth/update-password.html`,
      });

      submitBtn.textContent = 'Send reset link';
      submitBtn.disabled    = false;

      if (error) {
        errEl.textContent = error.message;
        errEl.hidden      = false;
        return;
      }

      // Always show success even if email not found — security best practice
      succEl.textContent = 'If that email is registered, a reset link is on its way. Check your inbox.';
      succEl.hidden      = false;
      form.reset();
    });
  </script>
</body>
</html>
