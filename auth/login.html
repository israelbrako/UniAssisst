<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c241c" />
  <link rel="icon" type="image/jpeg" href="../img/umat.jpg" />
  <link rel="apple-touch-icon" href="../img/umat.jpg" />
  <title>Sign in — UniAssist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css?v=5" />
</head>
<body class="auth-page">
  <div class="auth-box">
    <a class="logo" href="../index.html">
      <img class="logo-img" src="../img/umat.jpg" alt="UMAT logo" />
      UniAssist
    </a>
    <h1>Sign in</h1>
    <p class="sub">Access your dashboard, track requests, and chat with the team.</p>

    <div id="form-error" class="form-error" hidden></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Your password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;margin-top:0.5rem">Sign in</button>
    </form>

    <p class="form-footer">No account yet? <a href="signup.html">Create one</a></p>
    <p class="form-footer"><a href="forgot-password.html">Forgot your password?</a></p>
  </div>

  <script type="module">
    import { supabase, getProfile } from '../js/lib/supabase.js';

    const form      = document.getElementById('login-form');
    const errEl     = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    // If already logged in, redirect
    supabase.auth.getUser().then(async ({ data: { user } }) => {
      if (!user) return;
      const profile = await getProfile(user.id).catch(() => null);
      if (profile?.role === 'admin') window.location.href = '/admin/index.html';
      else window.location.href = '/dashboard/index.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.hidden = true;

      const email    = form.email.value.trim();
      const password = form.password.value;
      if (!email || !password) { errEl.textContent = 'Please fill both fields.'; errEl.hidden = false; return; }

      submitBtn.textContent = 'Signing in…';
      submitBtn.disabled = true;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      submitBtn.textContent = 'Sign in';
      submitBtn.disabled = false;

      if (error) {
        errEl.textContent = error.message;
        errEl.hidden = false;
        return;
      }

      try {
        const profile = await getProfile(data.user.id);
        if (profile?.role === 'admin') window.location.href = '/admin/index.html';
        else window.location.href = '/dashboard/index.html';
      } catch (profileErr) {
        // Show the exact error instead of silently redirecting
        errEl.textContent = 'Profile error: ' + (profileErr?.message ?? JSON.stringify(profileErr));
        errEl.hidden = false;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
