<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <link rel="icon" type="image/jpeg" href="../img/umat.jpg" />
  <link rel="apple-touch-icon" href="../img/umat.jpg" />
  <title>Sign in — UniAssist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css?v=5" />
</head>
<body class="auth-page">
  <div class="auth-box">
    <a class="logo" href="../index.html">
      <img class="logo-img" src="../img/umat.jpg" alt="UMAT logo" />
      UniAssist
    </a>
    <h1>Sign in</h1>
    <p class="sub">Access your dashboard, track requests, and chat with the team.</p>

    <div id="form-error" class="form-error" hidden></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Your password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;margin-top:0.5rem">Sign in</button>
    </form>

    <div class="oauth-divider"><span>or continue with</span></div>
<div class="oauth-buttons">
  <button type="button" class="oauth-btn" id="google-btn">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Google
  </button>
  <button type="button" class="oauth-btn" id="github-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#f8f8f8"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/></svg>
    GitHub
  </button>
</div>

    <p class="form-footer">No account yet? <a href="signup.html">Create one</a></p>
    <p class="form-footer"><a href="forgot-password.html">Forgot your password?</a></p>
  </div>

  <script type="module">
    import { supabase, getProfile } from '../js/lib/supabase.js';

    const form      = document.getElementById('login-form');
    const errEl     = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    // Don't auto-redirect — user must always sign in manually
    // (session timeout signs them out, so we never skip the login form)

    // Show confirmation success message if redirected from email link
    const hash = new URLSearchParams(window.location.hash.replace('#', '?'));
    const type = hash.get('type');
    if (type === 'signup' || type === 'email_change') {
      const succBanner = document.createElement('div');
      succBanner.className = 'form-success';
      succBanner.innerHTML = '✅ Email confirmed! You can now sign in.';
      document.getElementById('form-error').insertAdjacentElement('afterend', succBanner);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.hidden = true;

      const email    = form.email.value.trim();
      const password = form.password.value;
      if (!email || !password) { errEl.textContent = 'Please fill both fields.'; errEl.hidden = false; return; }

      submitBtn.textContent = 'Signing in…';
      submitBtn.disabled = true;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      submitBtn.textContent = 'Sign in';
      submitBtn.disabled = false;

      if (error) {
        errEl.textContent = error.message;
        errEl.hidden = false;
        return;
      }

      try {
        const profile = await getProfile(data.user.id);
        if (['admin','super_admin'].includes(profile?.role)) window.location.href = '/admin/index.html';
        else window.location.href = '/dashboard/index.html';
      } catch (profileErr) {
        // Show the exact error instead of silently redirecting
        errEl.textContent = 'Profile error: ' + (profileErr?.message ?? JSON.stringify(profileErr));
        errEl.hidden = false;
        submitBtn.disabled = false;
      }
    });

    // OAuth
    document.getElementById('google-btn')?.addEventListener('click', async () => {
      await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/auth/login.html' } });
    });
    document.getElementById('github-btn')?.addEventListener('click', async () => {
      await supabase.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: window.location.origin + '/auth/login.html' } });
    });
  </script>
</body>
</html>
