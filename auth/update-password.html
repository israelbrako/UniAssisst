<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c241c" />
  <link rel="icon" type="image/jpeg" href="../img/umat.jpg" />
  <link rel="apple-touch-icon" href="../img/umat.jpg" />
  <title>Set new password — UniAssist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css?v=5" />
</head>
<body class="auth-page">
  <div class="auth-box">
    <a class="logo" href="../index.html">
      <img class="logo-img" src="../img/umat.jpg" alt="UMAT logo" />
      UniAssist
    </a>
    <h1>Set new password</h1>
    <p class="sub">Choose a new password for your account.</p>

    <div id="form-error" class="form-error" hidden></div>
    <div id="form-success" class="form-success" hidden></div>
    <div id="invalid-link" hidden>
      <p class="form-error">This reset link is invalid or has expired.</p>
      <p class="form-footer"><a href="forgot-password.html">Request a new one →</a></p>
    </div>

    <form id="update-form" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required
          minlength="8" placeholder="At least 8 characters" />
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" required
          minlength="8" placeholder="Repeat your new password" />
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;margin-top:0.5rem">
        Update password
      </button>
    </form>
  </div>

  <script type="module">
    import { supabase } from '../js/lib/supabase.js';

    const form      = document.getElementById('update-form');
    const errEl     = document.getElementById('form-error');
    const succEl    = document.getElementById('form-success');
    const submitBtn = document.getElementById('submit-btn');
    const invalidEl = document.getElementById('invalid-link');

    // Supabase puts the session tokens in the URL hash when
    // the user clicks the reset link in their email.
    // We need to exchange them for a real session first.
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        // Valid reset link — form is ready, do nothing
        form.hidden = false;
      }
    });

    // Check if we have a valid recovery session on load
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      // No session — could be first load before onAuthStateChange fires.
      // Give it a moment then check again
      setTimeout(async () => {
        const { data: { session: s2 } } = await supabase.auth.getSession();
        if (!s2) {
          form.hidden     = true;
          invalidEl.hidden = false;
        }
      }, 1500);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.hidden  = true;
      succEl.hidden = true;

      const password = form.password.value;
      const confirm  = form.confirm.value;

      if (password.length < 8) {
        errEl.textContent = 'Password must be at least 8 characters.';
        errEl.hidden = false;
        return;
      }
      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.hidden = false;
        return;
      }

      submitBtn.textContent = 'Updating…';
      submitBtn.disabled    = true;

      const { error } = await supabase.auth.updateUser({ password });

      submitBtn.textContent = 'Update password';
      submitBtn.disabled    = false;

      if (error) {
        errEl.textContent = error.message;
        errEl.hidden      = false;
        return;
      }

      succEl.textContent = 'Password updated. Redirecting you to sign in…';
      succEl.hidden      = false;
      form.hidden        = true;

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    });
  </script>
</body>
</html>
