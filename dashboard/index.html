<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c241c" />
  <link rel="icon" type="image/jpeg" href="../img/umat.jpg" />
  <link rel="apple-touch-icon" href="../img/umat.jpg" />
  <title>My Requests — UniAssist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css?v=5" />
  <link rel="stylesheet" href="../css/app.css?v=1" />
  <style>
    .app-content { opacity: 0; transition: opacity .2s; }
    .app-content.ready { opacity: 1; }
  </style>
</head>
<body>

  <div class="app-layout">

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar populated by buildSidebar() -->
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <!-- ── Main content ───────────────────────────────────────── -->
    <div class="app-content" id="app-content">

      <!-- Mobile top bar -->
      <div class="app-topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Open menu">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <a class="logo" href="../index.html">
          <img class="logo-img" src="../img/umat.jpg" alt="UMAT" />
          UniAssist
        </a>
      </div>

      <div class="app-content-inner">

        <!-- Page header -->
        <div class="app-page-hd">
          <h1 id="greeting">My Requests</h1>
          <p id="greeting-sub">Here's everything you've sent to the team.</p>
        </div>

        <!-- Dark stat cards -->
        <div class="stat-grid">
          <div class="stat-card-dark">
            <div class="sc-label">Total</div>
            <span class="sc-value" id="s-total">0</span>
            <span class="sc-sub">All requests</span>
          </div>
          <div class="stat-card-dark">
            <div class="sc-label">Active</div>
            <span class="sc-value" id="s-active">0</span>
            <span class="sc-sub">Being handled</span>
          </div>
          <div class="stat-card-dark">
            <div class="sc-label">Completed</div>
            <span class="sc-value" id="s-completed">0</span>
            <span class="sc-sub">Done</span>
          </div>
          <div class="stat-card-dark">
            <div class="sc-label">Pending</div>
            <span class="sc-value" id="s-pending">0</span>
            <span class="sc-sub">Awaiting review</span>
          </div>
        </div>

        <!-- Content panel -->
        <div class="content-panel">
          <div class="content-panel-hd">
            <h2>Requests</h2>
            <a href="new-request.html" class="btn btn-primary" style="min-height:32px;padding:0.3rem 0.9rem;font-size:0.85rem;width:auto">+ New</a>
          </div>
          <div class="content-panel-body">
            <!-- Filter bar -->
            <div class="app-filter-bar">
              <button class="app-filter-btn is-active" data-filter="all">All</button>
              <button class="app-filter-btn" data-filter="pending,assigned">Active</button>
              <button class="app-filter-btn" data-filter="accepted,in_progress,review">In Progress</button>
              <button class="app-filter-btn" data-filter="completed">Completed</button>
              <button class="app-filter-btn" data-filter="declined">Declined</button>
            </div>
            <div id="req-list" class="req-list"></div>
          </div>
        </div>

      </div>

      <footer class="site-footer">
        <div class="container footer-inner">
          <p>© <span id="year"></span> UniAssist · ASCES Department</p>
          <p><a href="mailto:webverse.uniassist@gmail.com">webverse.uniassist@gmail.com</a></p>
        </div>
        <div class="container footer-credit-row">
          <div class="webverse-credit">
            <span>Developed by</span>
            <div class="webverse-credit-img-wrap">
              <img src="../img/webverse-logo-color.png" alt="WebVerse" />
            </div>
          </div>
        </div>
      </footer>

    </div><!-- end app-content -->
  </div><!-- end app-layout -->

  <script src="../js/main.js?v=5"></script>
  <script type="module">
    import { supabase, requireAuth } from '../js/lib/supabase.js';
    import { badge, timeAgo, escHtml, buildSidebar } from '../js/lib/ui.js';
    import { startSessionTimer } from '../js/lib/session.js';

    let allRequests = [];
    let currentFilter = 'all';

    async function init() {
      try {
        const auth = await requireAuth('../auth/login.html');
        if (!auth) return;
        const { user, profile } = auth;

        if (['admin','super_admin'].includes(profile.role)) {
          window.location.href = '../admin/index.html'; return;
        }

        const firstName = profile.full_name?.split(' ')[0] ?? 'there';
        const initials  = profile.full_name?.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase() ?? '?';

        document.getElementById('greeting').textContent     = `Hey, ${firstName} 👋`;
        document.getElementById('greeting-sub').textContent = `Here's everything you've sent to the team.`;
        document.getElementById('year').textContent = new Date().getFullYear();

        buildSidebar({ role: 'student', profile, active: 'dashboard', basePath: '../',
          onSignout: async () => { await supabase.auth.signOut(); window.location.href = '../auth/login.html'; } });

        startSessionTimer('../auth/login.html');
        loadNotifCount(user.id);
        document.getElementById('app-content').classList.add('ready');

        await loadRequests(user.id);
        setupFilters();
        subscribeRealtime(user.id);

      } catch (err) {
        console.error('Dashboard init error:', err);
        await supabase.auth.signOut();
        window.location.href = '../auth/login.html';
      }
    }

    function setupSidebar() {
      const toggle  = document.getElementById('sidebar-toggle');
      const overlay = document.getElementById('sidebar-overlay');
      toggle?.addEventListener('click', () => document.body.classList.add('sidebar-open-app'));
      overlay?.addEventListener('click', () => document.body.classList.remove('sidebar-open-app'));
    }

    function setupSignout(path) {
      document.getElementById('signout-btn')?.addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = path;
      });
    }

    async function loadNotifCount(userId) {
      const { count } = await supabase
        .from('notifications')
        .select('id', { count: 'exact', head: true })
        .eq('user_id', userId)
        .eq('read', false);
      const el = document.getElementById('sidebar-notif-count');
      if (el && count > 0) {
        el.textContent = count > 9 ? '9+' : count;
        el.style.display = 'grid';
      }
    }

    async function loadRequests(userId) {
      const list = document.getElementById('req-list');
      list.innerHTML = `<p style="color:var(--muted);font-size:0.9rem;padding:0.5rem 0">Fetching your requests…</p>`;

      const { data, error } = await supabase
        .from('requests')
        .select(`id, service, title, status, created_at, deadline, assigned_to ( full_name )`)
        .eq('student_id', userId)
        .order('created_at', { ascending: false });

      if (error) {
        list.innerHTML = `<div class="form-error">Could not load your requests. Please refresh.</div>`;
        return;
      }

      allRequests = data ?? [];
      updateStats();
      renderList();
    }

    function updateStats() {
      const active    = allRequests.filter(r => ['pending','assigned','accepted'].includes(r.status)).length;
      const inProg    = allRequests.filter(r => ['in_progress','review'].includes(r.status)).length;
      const completed = allRequests.filter(r => r.status === 'completed').length;
      const pending   = allRequests.filter(r => r.status === 'pending').length;
      document.getElementById('s-total').textContent     = allRequests.length;
      document.getElementById('s-active').textContent    = active + inProg;
      document.getElementById('s-completed').textContent = completed;
      document.getElementById('s-pending').textContent   = pending;
    }

    function renderList() {
      const filtered = currentFilter === 'all'
        ? allRequests
        : allRequests.filter(r => currentFilter.split(',').includes(r.status));

      const list = document.getElementById('req-list');
      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6M9 16h6M6 2h9l5 5v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/></svg>
            <p>${currentFilter === 'all' ? 'No requests yet. <a href="new-request.html">Make your first one →</a>' : 'Nothing in this category.'}</p>
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(r => `
        <a class="req-card" href="request.html?id=${r.id}">
          <div class="req-card-top">
            <h3>${escHtml(r.title)}</h3>
            ${badge(r.status)}
          </div>
          <div class="req-card-meta">
            <span>${escHtml(r.service)}</span>
            ${r.assigned_to ? `<span>With ${escHtml(r.assigned_to.full_name)}</span>` : ''}
            ${r.deadline ? `<span>Due ${escHtml(r.deadline)}</span>` : ''}
            <span>${timeAgo(r.created_at)}</span>
          </div>
        </a>`).join('');
    }

    function setupFilters() {
      document.querySelectorAll('.app-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.app-filter-btn').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          currentFilter = btn.dataset.filter;
          renderList();
        });
      });
    }

    function subscribeRealtime(userId) {
      supabase.channel('student-requests-' + userId)
        .on('postgres_changes', {
          event: '*', schema: 'public', table: 'requests',
          filter: `student_id=eq.${userId}`,
        }, () => loadRequests(userId))
        .subscribe();
    }

    init();
  </script>
</body>
</html>
