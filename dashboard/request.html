<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c241c" />
  <link rel="icon" type="image/jpeg" href="../img/umat.jpg" />
  <link rel="apple-touch-icon" href="../img/umat.jpg" />
  <title>Request — UniAssist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css?v=5" />
  <link rel="stylesheet" href="../css/app.css?v=1" />
  <style>
    .app-content { opacity: 0; transition: opacity .2s; }
    .app-content.ready { opacity: 1; }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-content" id="app-content">
      <div class="app-topbar">
        <button class="sidebar-toggle" id="sidebar-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <a class="logo" href="../index.html"><img class="logo-img" src="../img/umat.jpg" alt="UMAT" /> UniAssist</a>
      </div>

      <div class="app-content-inner" style="max-width:860px">
        <a href="index.html" style="display:inline-flex;align-items:center;gap:0.3rem;color:var(--muted);text-decoration:none;font-size:0.88rem;margin-bottom:1rem">← My Requests</a>

        <div class="app-page-hd">
          <div><h1 id="req-title">Loading…</h1><p id="req-meta"></p></div>
          <div id="req-badge"></div>
        </div>

        <div id="new-banner" class="form-success" hidden>
          Your request has been submitted. We've assigned it to an available team member and they'll respond shortly.
        </div>
        <div id="decline-box" class="form-error" hidden>
          <strong>Request declined.</strong> <span id="decline-reason"></span>
        </div>

        <div style="display:grid;gap:1rem" id="body-grid">
          <!-- Left: details + timeline -->
          <div>
            <div class="content-panel">
              <div class="content-panel-hd"><h2>Details</h2></div>
              <div class="content-panel-body"><dl id="req-details"></dl></div>
            </div>
            <div class="content-panel">
              <div class="content-panel-hd"><h2>Status Timeline</h2></div>
              <div class="content-panel-body">
                <ul class="timeline" id="timeline">
                  <li style="color:var(--muted);font-size:0.9rem">Loading…</li>
                </ul>
              </div>
            </div>
          </div>

          <!-- Right: chat -->
          <div id="chat-section" hidden>
            <div class="content-panel" style="padding:0">
              <div class="content-panel-hd" style="padding:0.85rem 1.25rem 0.75rem">
                <h2>Chat with <span id="admin-name">your tutor</span></h2>
              </div>
              <div class="chat-wrap" style="border:none;border-radius:0">
                <div class="chat-messages" id="chat-messages">
                  <p style="color:var(--muted);font-size:0.88rem;text-align:center;margin:auto">No messages yet. Say hello!</p>
                </div>
                <div class="chat-input-row">
                  <textarea id="msg-input" placeholder="Type a message…" rows="1"></textarea>
                  <button class="btn btn-primary" id="send-btn" style="width:auto;min-height:42px;padding:0 1rem">Send</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="site-footer">
        <div class="container footer-inner"><p>© <span id="year"></span> UniAssist · ASCES Department</p></div>
        <div class="container footer-credit-row"><div class="webverse-credit"><span>Developed by</span><div class="webverse-credit-img-wrap"><img src="../img/webverse-logo-color.png" alt="WebVerse" /></div></div></div>
      </footer>
    </div>
  </div>

  <script src="../js/main.js?v=5"></script>
  <script type="module">
    import { supabase, requireAuth } from '../js/lib/supabase.js';
    import { badge, timeAgo, fmtDate, escHtml, buildSidebar } from '../js/lib/ui.js';
    import { startSessionTimer } from '../js/lib/session.js';

    const reqId = new URLSearchParams(location.search).get('id');
    let currentUser = null;

    async function init() {
      const auth = await requireAuth('../auth/login.html');
      if (!auth) return;
      currentUser = auth.user;
      const { profile } = auth;

      if (['admin','super_admin'].includes(profile.role)) { window.location.href = `../admin/request.html?id=${reqId}`; return; }
      if (!reqId) { window.location.href = 'index.html'; return; }

      document.getElementById('year').textContent = new Date().getFullYear();
      buildSidebar({ role: 'student', profile, active: 'dashboard', basePath: '../',
        onSignout: async () => { await supabase.auth.signOut(); window.location.href = '../auth/login.html'; } });

      startSessionTimer('../auth/login.html');
      document.getElementById('app-content').classList.add('ready');

      if (new URLSearchParams(location.search).get('new') === '1') {
        document.getElementById('new-banner').hidden = false;
      }

      await loadRequest();
      await loadTimeline();
    }

    async function loadRequest() {
      const { data: req, error } = await supabase
        .from('requests').select(`*, assigned_to ( id, full_name )`).eq('id', reqId).single();

      if (error || !req) { window.location.href = 'index.html'; return; }

      document.getElementById('req-title').textContent = req.title;
      document.getElementById('req-meta').textContent  = `${req.service} · Submitted ${timeAgo(req.created_at)}`;
      document.getElementById('req-badge').innerHTML   = badge(req.status);

      document.getElementById('req-details').innerHTML = `
        <div class="kv"><dt>Service</dt><dd>${escHtml(req.service)}</dd></div>
        <div class="kv"><dt>Class / Year</dt><dd>${escHtml(req.class_year ?? '—')}</dd></div>
        <div class="kv"><dt>Deadline</dt><dd>${fmtDate(req.deadline)}</dd></div>
        <div class="kv"><dt>Description</dt><dd class="note-box">${escHtml(req.description)}</dd></div>
        ${req.file_url ? `<div class="kv"><dt>File</dt><dd><a href="${escHtml(req.file_url)}" target="_blank">Download attachment</a></dd></div>` : ''}
        ${req.assigned_to ? `<div class="kv"><dt>Assigned to</dt><dd>${escHtml(req.assigned_to.full_name)}</dd></div>` : ''}`;

      if (req.status === 'declined' && req.decline_reason) {
        document.getElementById('decline-reason').textContent = req.decline_reason;
        document.getElementById('decline-box').hidden = false;
      }

      const chatStatuses = ['accepted','in_progress','review','completed'];
      if (chatStatuses.includes(req.status) && req.assigned_to) {
        document.getElementById('chat-section').hidden = false;
        document.getElementById('admin-name').textContent = req.assigned_to.full_name;
        await loadMessages(null);
        setupChat();
        subscribeMessages();
      }

      if (chatStatuses.includes(req.status) && window.innerWidth >= 800) {
        document.getElementById('body-grid').style.gridTemplateColumns = '1fr 1fr';
      }
    }

    async function loadTimeline() {
      const { data } = await supabase.from('status_updates').select(`*, admin:admin_id ( full_name )`).eq('request_id', reqId).order('created_at', { ascending: true });
      const tl = document.getElementById('timeline');
      if (!data || data.length === 0) { tl.innerHTML = '<li style="color:var(--muted);font-size:0.88rem">No updates yet.</li>'; return; }
      tl.innerHTML = data.map(u => `
        <li class="tl-item">
          <div class="tl-dot"></div>
          <div class="tl-body">
            <p class="tl-status">${escHtml(u.status)}</p>
            ${u.note ? `<p class="tl-note">${escHtml(u.note)}</p>` : ''}
            <p class="tl-time">${u.admin?.full_name ? escHtml(u.admin.full_name) + ' · ' : ''}${timeAgo(u.created_at)}</p>
          </div>
        </li>`).join('');
    }

    async function loadMessages(adminId) {
      const { data } = await supabase.from('messages').select(`*, sender:sender_id ( full_name )`).eq('request_id', reqId).order('created_at', { ascending: true });
      const container = document.getElementById('chat-messages');
      if (!data || data.length === 0) { container.innerHTML = '<p style="color:var(--muted);font-size:0.88rem;text-align:center;margin:auto">No messages yet. Say hello!</p>'; return; }
      container.innerHTML = data.map(m => {
        const mine = m.sender_id === currentUser.id;
        return `<div class="msg ${mine ? 'msg-mine' : 'msg-theirs'}">
          <div class="msg-bubble">${escHtml(m.content)}</div>
          <span class="msg-meta">${mine ? 'You' : escHtml(m.sender?.full_name ?? 'Admin')} · ${timeAgo(m.created_at)}</span>
        </div>`;
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    function setupChat() {
      const input = document.getElementById('msg-input');
      const sendBtn = document.getElementById('send-btn');
      async function send() {
        const content = input.value.trim();
        if (!content) return;
        input.value = ''; sendBtn.disabled = true;
        const { error } = await supabase.from('messages').insert({ request_id: reqId, sender_id: currentUser.id, content });
        if (error) { alert('Could not send: ' + error.message); input.value = content; sendBtn.disabled = false; return; }
        await loadMessages(null);
        sendBtn.disabled = false; input.focus();
      }
      sendBtn.addEventListener('click', send);
      input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    }

    function subscribeMessages() {
      supabase.channel('chat-student-' + reqId)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `request_id=eq.${reqId}` }, () => loadMessages(null))
        .subscribe();
      supabase.channel('timeline-student-' + reqId)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'status_updates', filter: `request_id=eq.${reqId}` }, () => { loadTimeline(); loadRequest(); })
        .subscribe();
      setInterval(() => loadMessages(null), 3000);
    }

    init();
  </script>
</body>
</html>
